resources:
  repositories:
    - repository: Pipelines
      type: git
      name: Pipeline
      ref: 'main'
variables:
- name: buildprojects
  value: '**/*.sln'
- name: BuildConfiguration
  value: 'Release'
name: $(date:yyyyMMdd)$(rev:.r)

stages:
  - stage:
    jobs:
      - template: BuildPipelines/dotnet.yml@Pipelines
  